<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>عارض المستندات (KoBo)</title>
  <style>
    body { margin:0; padding:0; background:#1e1e1e; color:#fff; font-family:sans-serif;
           height:100vh; display:flex; flex-direction:column; overflow:hidden; }

    #kobo-inpage-header-banner { background:#1e1e1e; padding:8px 16px; border-bottom:2px solid #2980b9;
           box-shadow:0 2px 10px rgba(0,0,0,.5); display:flex; justify-content:space-between;
           align-items:center; box-sizing:border-box; z-index:10; flex-shrink:0; }
    .banner-center { flex:2; text-align:center; overflow:hidden; white-space:nowrap;
           text-overflow:ellipsis; font-size:16px; font-weight:bold; }
    .banner-controls { flex:1; display:flex; align-items:center; justify-content:flex-end; gap:8px; direction:ltr; }
    .zoom-ctrl { display:flex; align-items:center; gap:6px; background:#2b2b2b; padding:3px 8px;
           border-radius:4px; border:1px solid #444; }
    button { background:#34495e; color:#fff; border:1px solid #555; padding:4px 8px; border-radius:4px;
           cursor:pointer; font-size:12px; font-weight:bold; }
    button#kobo-rotate-reset { background:#c0392b; font-size:11px; }
    button:hover { filter:brightness(1.2); }

    #viewer-content { flex:1; display:flex; justify-content:center; align-items:center;
           overflow:auto; position:relative; flex-direction:column; gap:10px; }
    #status { color:#a1a1aa; font-size:14px; }
    #status a { color:#60a5fa; }
    body.pdf-mode #viewer-content { display:block; overflow:hidden; }
    body.pdf-mode #media-container { width:100%; height:100%; }
    .pdf-frame { width:100%; height:100%; border:0; background:#fff; }
    .doc-media { max-width:95%; max-height:90vh; box-shadow:0 5px 15px rgba(0,0,0,.5);
           transition:transform .2s ease; transform-origin:center center; }
  </style>
</head>
<body>
  <div id="kobo-inpage-header-banner">
    <div style="flex:1;"></div>
    <div class="banner-center" id="doc-title">📄 جاري التحميل...</div>
    <div class="banner-controls">
      <div class="zoom-ctrl">
        <span>🔍</span>
        <input type="range" id="kobo-zoom-slider" min="0.5" max="3" step="0.1" value="1"
               style="width:80px;cursor:pointer;accent-color:#2ecc71;">
        <span id="kobo-zoom-val" style="color:#2ecc71;font-size:11px;min-width:35px;font-weight:bold;">100%</span>
      </div>
      <button id="kobo-rotate-left" title="Rotate left">↺ 90°</button>
      <button id="kobo-rotate-right" title="Rotate right">↻ 90°</button>
      <button id="kobo-rotate-reset" title="Reset">Reset</button>
    </div>
  </div>

  <div id="viewer-content">
    <div id="media-container"></div>
    <div id="status"></div>
  </div>

  <script src="viewer.js"></script>
</body>
</html>
