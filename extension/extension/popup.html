<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="bar">
    <div class="stat">
      <span class="k">المساحة المسجلة: </span>
      <b id="declared-val">--</b>
    </div>
    <div class="stat">
      <span class="k">المساحة المحسوبة: </span>
      <b id="drawn-val">--</b>
    </div>
  </div>

  <div id="map">
    <div id="tiles"></div>
    <svg id="overlay"></svg>
    <div id="tip"></div>
    <div class="ctrl">
      <button id="btn-zo">+</button>
      <button id="btn-zi">−</button>
      <button id="btn-fit">🎯</button>
    </div>
    <div id="notice">لا توجد إحداثيات متاحة</div>
    <div id="attr"> Esri World Imagery, OpenStreetMap</div>
  </div>

  <div id="empty">لا توجد بيانات متاحة للمزرعة الحالية</div>

  <script src="popup.js"></script>
</body>
</html>
